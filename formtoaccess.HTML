<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PW</title>
</head>

<body>
    <div style="text-align: center;">
        <h1 style="text-decoration: wavy;">Fill to Access Study Material</h1>
    </div>
    <div>
        <form action="Notes.HTML">
            <label for="8899">Name:</label>
            <input type="text" id="8899" placeholder="Enter Your Name" required>
            <br><br>
            <label for="8877">Class:</label>
            <input type="number" id="8877" min="0" placeholder="Enter your Class" required>
            <br><br>
            <label for="8866">Mobile number:</label>
            <input type="number" id="8866" min="0" placeholder="Enter your Mobile Number" required>
            <br><br>
            <label for="8855">Student at:</label>
            <select name="Student at" id="8855">
                <option value="Select an option">Select an option</option>
                <option value="PW Online">PW Online</option>
                <option value="PW Vidyapith">PW Vidyapith</option>
            </select>
            <br><br>
            <label for="0021">Gender:</label>
            <label for="0022">Male</label>
            <input type="radio" id="0022" name="gender" required>
            <label for="0023">Female</label>
            <input type="radio" name="gender" id="0023" required>
            <br><br>
            <label for="email" >Email:</label>
            <input type="email" id="email" placeholder="Enter your Email Address" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" required>
            <br><br>
            <label for="checkbox" id="Accounts">By Continuing, For Create or Login in Accounts: <br> You Agree our terms
                and policies</label><a href="terms.HTML">Term & Condition</a> and <a
                href="PrivicyandPolicies.HTML">Policies</a>
            <input type="checkbox" id="Accounts" required>
            <br>
            <label for="correct">I confirm that my registration information is correct.</label>
            <input type="checkbox" id="correct">
            <br><br>
            <button style="background-color: cornsilk;">Access</button>
        </form>
    </div>
</body>

</html>
